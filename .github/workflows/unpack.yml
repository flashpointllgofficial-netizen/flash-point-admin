name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o flashpoint-admin-part1.zip -x "fp-admin/.github/*"
          cp -a fp-admin/. .
          rm -rf fp-admin flashpoint-admin-part1.zip
          mkdir -p app/src/main/res/drawable
          [ -f app_logo.png ] && mv app_logo.png app/src/main/res/drawable/app_logo.png
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Admin project"
          git push
